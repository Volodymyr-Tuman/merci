<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка медіа-партнера</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2>Заявка на медіа-партнерство</h2>

    <form id="partnerForm">
        <label for="name">Ім'я:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="age">Вік:</label><br>
        <input type="number" id="age" name="age"><br><br>

        <label for="tiktok">Посилання на TikTok:</label><br>
        <input type="text" id="tiktok" name="tiktok"><br><br>

        <button type="button" id="submitBtn">Надіслати</button>
    </form>

    <p id="errorMsg" style="color: red;"></p>

    <script>
        var tg = null;

        // Захист від передчасного завантаження: чекаємо, поки з'явиться window.Telegram.WebApp
        function initApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            } else {
                setTimeout(initApp, 100);
            }
        }
        initApp();

        document.getElementById('submitBtn').addEventListener('click', function () {
            var name = document.getElementById('name').value.trim();
            var age = document.getElementById('age').value.trim();
            var tiktok = document.getElementById('tiktok').value.trim();
            var errorMsg = document.getElementById('errorMsg');

            if (!name || !age || !tiktok) {
                errorMsg.textContent = "Будь ласка, заповніть усі поля.";
                return;
            }
            errorMsg.textContent = "";

            var formData = {
                name: name,
                age: age,
                tiktok: tiktok
            };

            if (!tg) {
                errorMsg.textContent = "Помилка: Telegram WebApp ще не ініціалізовано, спробуйте ще раз.";
                return;
            }

            tg.sendData(JSON.stringify(formData));
        });
    </script>
</body>
</html>
