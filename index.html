<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка медіа-партнера</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            --bg-0: #07060a;
            --bg-1: #0d0b14;
            --panel: rgba(24, 20, 36, 0.4);
            --panel-border: rgba(245, 205, 130, 0.14);
            --field-bg: rgba(12, 10, 20, 0.55);
            --field-border: rgba(255, 255, 255, 0.1);
            --gold: #f2b64c;
            --gold-soft: #ffdf9e;
            --violet: #8f5bff;
            --violet-soft: #b58aff;
            --text: #efe9fb;
            --muted: #9c93b8;
            --error: #ff6b7a;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(18px, 6vw, 48px);
            font-family: 'Manrope', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 18% 10%, rgba(143, 91, 255, 0.16), transparent 42%),
                radial-gradient(circle at 85% 90%, rgba(242, 182, 76, 0.13), transparent 45%),
                linear-gradient(180deg, var(--bg-0), var(--bg-1));
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: clamp(26px, 6vw, 36px) clamp(22px, 5vw, 32px) clamp(28px, 6vw, 34px);
            border-radius: 26px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, rgba(255, 255, 255, 0.05), transparent 40%);
            pointer-events: none;
        }

        h2 {
            position: relative;
            margin: 0 0 6px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(21px, 5vw, 25px);
            letter-spacing: 0.03em;
            line-height: 1.3;
            background: linear-gradient(100deg, var(--gold-soft), var(--gold) 40%, var(--violet-soft) 85%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            position: relative;
            margin: 0 0 26px;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        form {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input {
            appearance: none;
            width: 100%;
            padding: 13px 15px;
            border-radius: 13px;
            border: 1px solid var(--field-border);
            background: var(--field-bg);
            color: var(--text);
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        input::placeholder {
            color: rgba(239, 233, 251, 0.32);
        }

        input:hover {
            border-color: rgba(245, 205, 130, 0.3);
        }

        input:focus {
            border-color: var(--gold-soft);
            background: rgba(12, 10, 20, 0.75);
            box-shadow: 0 0 0 3px rgba(242, 182, 76, 0.14), 0 0 18px -2px rgba(143, 91, 255, 0.35);
        }

        /* remove number input spinners for a cleaner glass look */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .btn_link {
            position: relative;
            width: 100%;
            margin-top: 6px;
            padding: 15px 18px;
            border-radius: 15px;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
            background: rgba(12, 10, 20, 0.65);
            cursor: pointer;
            overflow: hidden;
            isolation: isolate;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
        }

        .btn_link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: conic-gradient(from var(--angle), var(--gold) 0deg, var(--violet) 120deg, var(--gold-soft) 210deg, var(--violet-soft) 300deg, var(--gold) 360deg);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin 3.5s linear infinite;
            z-index: -2;
        }

        .btn_link::after {
            content: "";
            position: absolute;
            inset: -30%;
            background: radial-gradient(circle, rgba(242, 182, 76, 0.35), rgba(143, 91, 255, 0.25) 45%, transparent 70%);
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.4s ease, transform 0.5s ease;
            z-index: -3;
        }

        .btn_link .shine {
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
            pointer-events: none;
        }

        .btn_link:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(18, 15, 28, 0.75);
        }

        .btn_link:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .btn_link:hover .shine {
            left: 120%;
        }

        .btn_link:active {
            transform: translateY(-1px) scale(0.98);
        }

        .btn_link:focus-visible {
            outline: 2px solid var(--gold-soft);
            outline-offset: 3px;
        }

        .btn_link:disabled {
            opacity: 0.55;
            cursor: default;
            transform: none;
        }

        #errorMsg {
            min-height: 18px;
            margin: 12px 2px 0;
            font-size: 13px;
            color: var(--error);
            letter-spacing: 0.01em;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #errorMsg.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes spin {
            to {
                --angle: 360deg;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn_link::before {
                animation: none;
            }

            .btn_link,
            input,
            #errorMsg {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Заявка на медіа-партнерство</h2>
        <p class="subtitle">Заповни поля нижче, і ми зв'яжемось із тобою</p>

        <form id="partnerForm">
            <div class="field">
                <label for="name">Ім'я</label>
                <input type="text" id="name" name="name" placeholder="Твоє ім'я" autocomplete="off">
            </div>

            <div class="field">
                <label for="age">Вік</label>
                <input type="number" id="age" name="age" placeholder="Наприклад, 18" autocomplete="off">
            </div>

            <div class="field">
                <label for="tiktok">Посилання на TikTok акаунт</label>
                <input type="text" id="tiktok" name="tiktok" placeholder="https://www.tiktok.com/@nickname" autocomplete="off">
            </div>

            <button type="button" class="btn_link" id="submitBtn">
                Надіслати
                <span class="shine"></span>
            </button>

            <p id="errorMsg"></p>
        </form>
    </div>

    <script>
        var tg = null;

        // Захист від передчасного завантаження: чекаємо, поки з'явиться window.Telegram.WebApp
        function initApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
            } else {
                setTimeout(initApp, 100);
            }
        }
        initApp();

        var errorMsg = document.getElementById('errorMsg');

        function showError(text) {
            errorMsg.textContent = text;
            errorMsg.classList.toggle('show', Boolean(text));
        }

        document.getElementById('submitBtn').addEventListener('click', function () {
            var name = document.getElementById('name').value.trim();
            var age = document.getElementById('age').value.trim();
            var tiktok = document.getElementById('tiktok').value.trim();

            if (!name || !age || !tiktok) {
                showError("Будь ласка, заповніть усі поля.");
                return;
            }
            showError("");

            var formData = {
                name: name,
                age: age,
                tiktok: tiktok
            };

            if (!tg) {
                showError("Помилка: Telegram WebApp ще не ініціалізовано, спробуйте ще раз.");
                return;
            }

            tg.sendData(JSON.stringify(formData));
        });
    </script>
</body>

</html>
