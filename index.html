<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета партнера</title>
    
    <!-- Дозволяємо GitHub Pages підключити зовнішній скрипт -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; style-src * 'unsafe-inline';">
    
    <!-- Скрипт Telegram завантажується першим -->
    <script src="https://telegram.org"></script>
</head>
<body>

    <h2>Заповніть анкету</h2>

    <label>Ім'я:</label><br>
    <input type="text" id="userName" placeholder="Введіть ім'я123"><br><br>

    <label>Вік:</label><br>
    <input type="number" id="userAge" placeholder="Наприклад, 20"><br><br>

    <label>TikTok:</label><br>
    <input type="text" id="ttLink" placeholder="https://..."><br><br>

    <button id="submitBtn">Надіслати</button>

    <script>
        function initTelegramApp() {
            // Безпечно перевіряємо наявність об'єкта
            const tg = window.Telegram?.WebApp;

            if (tg) {
                tg.ready(); 
                tg.expand(); 

                document.getElementById('submitBtn').addEventListener('click', () => {
                    const name = document.getElementById('userName').value.trim();
                    const age = document.getElementById('userAge').value.trim();
                    const tiktok = document.getElementById('ttLink').value.trim();

                    if (!name || !age || !tiktok) {
                        alert('Будь ласка, заповніть усі поля!');
                        return;
                    }

                    const formData = {
                        name: name,
                        age: age,
                        tiktok: tiktok
                    };

                    // Передаємо дані у Python-код. Вікно закриється автоматично
                    tg.sendData(JSON.stringify(formData));
                });
            } else {
                // Якщо скрипт не встиг завантажитись, пробуємо знову через 50 мілісекунд
                setTimeout(initTelegramApp, 50);
            }
        }

        // Запуск ініціалізації
        initTelegramApp();
    </script>

</body>
</html>
